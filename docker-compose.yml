# Runs the whole application with one command:
#
#     docker compose up --build
#
# then open http://localhost:8080
#
# Values such as ${DB_NAME} are read from the .env file next to this file.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Named volume: the data survives `docker compose down`.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database is the "db" service, not 127.0.0.1.
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "False"
      # A separate variable name, so the key used by Docker does not change
      # the key of the server you run directly with `manage.py runserver`.
      DJANGO_SECRET_KEY: ${DOCKER_DJANGO_SECRET_KEY:?Set DOCKER_DJANGO_SECRET_KEY in .env (see .env.example)}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:8080
      # Add this URI to "Authorized redirect URIs" in Google Cloud.
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/gmail/callback/
      # Google OAuth normally requires https. This allows plain http for
      # running on your own machine. Remove it on a real server.
      OAUTHLIB_INSECURE_TRANSPORT: "1"
    depends_on:
      db:
        condition: service_healthy
    # Docker calls this every few seconds; "healthy" means Django answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
