# nginx does two jobs:
#   1. serves the built React app
#   2. forwards /api, /admin and /static to Django
# so the browser talks to one origin and no CORS is involved.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
    }

    # Files with a content hash in their name never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router: any other URL (/dashboard, /applications, ...) is not a
    # file on disk, so answer with index.html and let React pick the page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
